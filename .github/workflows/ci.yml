name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever its base: a PR stacked on another branch still gets tested.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      # Everything the test suite imports. Hardware modules (smbus, RPi.GPIO,
      # picamera2, board, ...) are stubbed in tests/conftest.py instead.
      - name: Install CI test dependencies
        run: |
          pip install \
            pytest \
            numpy Pillow brotli \
            piexif \
            bitstring bitarray \
            pyserial requests \
            pympler \
            sortedcontainers intervaltree \
            dill multiprocess \
            astor astunparse \
            psutil py-gpsd2 \
            opencv-python-headless SimpleITK pandas rasterio \
            onnx onnxruntime

      # Nodes run the committed output/ticktalk_main.pickle, not the source.
      # compile.py is deterministic, so a fresh build must match the committed
      # pickle byte for byte (and its .sha256, which runrtm.py checks at start).
      - name: Committed pickle matches ticktalk_main.py
        run: |
          out=$(mktemp -d)
          if ! python compile.py ticktalk_main.py --out "$out" > "$out/compile.log" 2>&1; then
            tail -n 40 "$out/compile.log"
            echo "::error file=ticktalk_main.py::compile.py ticktalk_main.py failed"
            exit 1
          fi
          fresh=$(sha256sum "$out/ticktalk_main.pickle" | cut -d' ' -f1)
          committed=$(sha256sum output/ticktalk_main.pickle | cut -d' ' -f1)
          recorded=$(cut -d' ' -f1 output/ticktalk_main.pickle.sha256)
          echo "fresh build:      $fresh"
          echo "committed pickle: $committed"
          echo "committed sha256: $recorded"
          if [ "$fresh" != "$committed" ] || [ "$committed" != "$recorded" ]; then
            echo "::error file=output/ticktalk_main.pickle::output/ticktalk_main.pickle does not match ticktalk_main.py. Run 'python compile.py ticktalk_main.py --out output' and commit both output/ticktalk_main.pickle and output/ticktalk_main.pickle.sha256."
            exit 1
          fi

      # Discovers every tests/test_*.py, so a new test file is run without
      # touching this workflow. -rs lists every skip and its reason, so a
      # test that silently stops running shows up in the log.
      #
      # Skips that are expected: mDot hardware integration tests, and the live
      # API tests in test_ip_upload.py, which only run with WATERCAM_SERVER_URL
      # set (never against the production server).
      - name: Run all tests
        run: python -m pytest tests -v --tb=short -rs

  requirements:
    # CI doesn't install requirements.txt (the node venv needs Pi hardware
    # libraries), so check it still resolves for the nodes: Raspberry Pi
    # OS, aarch64, Python 3.13. Catches conflicting pins, e.g. from a
    # Dependabot bump, before they reach a node.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve requirements.txt for the nodes
        run: |
          pip install uv
          uv pip compile requirements.txt \
            --python-version 3.13 \
            --python-platform aarch64-unknown-linux-gnu \
            -o resolved-aarch64.txt
          echo "Resolved $(grep -c '==' resolved-aarch64.txt) packages for aarch64 / Python 3.13"
