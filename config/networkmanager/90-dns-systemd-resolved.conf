# Hand DNS to systemd-resolved instead of writing /etc/resolv.conf directly.
# Without resolved, NetworkManager rewrites resolv.conf whenever a connection
# comes up or goes down (the Quectel connection does this on demand), dropping
# Tailscale's 100.100.100.100: the server's tailnet name stops resolving and the
# IP uplink falls back to cellular. Needs the systemd-resolved package. Install to
# /etc/NetworkManager/conf.d/ (docs/FIELD_DEPLOYMENT_GUIDE.md, section 1.3).
[main]
dns=systemd-resolved
