# Drop-in for serial-getty@ttyAMA0.service: install as
#   /etc/systemd/system/serial-getty@ttyAMA0.service.d/watercam-noise.conf
#
# A floating RX line on the Pi's serial console (loose header cables with
# nothing on the other end) makes agetty exit with "input overrun" and restart:
# 006 logged 11,556 overruns in 41 hours (2026-10-17/19). This only rate-limits
# agetty's messages so they can't flood the journal; the login prompt still
# comes back at once for a technician. Tying off the cables' free ends stops
# the noise itself.
[Service]
LogRateLimitIntervalSec=10min
LogRateLimitBurst=10
