# Drop-in for serial-getty@ttyAMA0.service: install as
#   /etc/systemd/system/serial-getty@ttyAMA0.service.d/watercam-noise.conf
#
# A floating or noisy RX line on the Pi's serial console (a UART cable with
# nothing on the other end) makes agetty exit with "input overrun", and the
# stock unit restarts it at once: 006 logged 11,556 overruns, each with a
# restart, in 41 hours (2026-10-17/19). Waiting a minute between restarts
# cuts that about fivefold, and agetty's own messages are rate-limited. A
# technician who connects may wait up to a minute for the login prompt (press
# Enter). The real fix is wiring: tie RX to GND or keep the cable connected.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=60
LogRateLimitIntervalSec=10min
LogRateLimitBurst=10
