# systemd-resolved on a node (installed with the NetworkManager drop-in,
# docs/FIELD_DEPLOYMENT_GUIDE.md section 1.3). Install to
# /etc/systemd/resolved.conf.d/.
#
# LLMNR and multicast DNS answer name queries from anyone on the same WiFi or
# cellular network (TCP/UDP 5355, UDP 5353), giving out the unit's hostname, and
# nodes have no use for either: names come from DNS and MagicDNS.
[Resolve]
LLMNR=no
MulticastDNS=no
