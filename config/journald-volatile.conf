# Keep the systemd journal in RAM (/run/log/journal) rather than on the
# microSD card, to cut card wear. Logs are lost at each shutdown or power cut;
# the power logger (tools/powerlog.py) writes its own CSV for anything that
# has to survive a brownout.
#
# Install:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp config/journald-volatile.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#   sudo rm -rf /var/log/journal    # optional: frees the space the old on-card journal used
[Journal]
Storage=volatile
RuntimeMaxUse=64M
