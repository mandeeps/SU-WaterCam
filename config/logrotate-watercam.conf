# WaterCam node logs that otherwise only ever grow on the microSD card.
# Install (docs/FIELD_DEPLOYMENT_GUIDE.md 1.9):
#   sudo cp config/logrotate-watercam.conf /etc/logrotate.d/watercam
# logrotate.timer runs daily, and at the next boot when the unit was off.
#
# copytruncate: powerlog.service keeps its CSV open, and powerlog.py writes the
# header again whenever the file is empty. Rotated copies are powerlog.csv.1.gz
# etc., so a `*.csv` glob only ever sees the current file.
#
# Not rotated: ~/wittypi/wittyPi.log and schedule.log. wittypi-boot-mark.service
# records this boot's byte offset into wittyPi.log, and recovery_boot.py and
# wait_for_wittypi_schedule.py read from it; rotating it at boot (when
# logrotate.timer catches up) would break that. It grows a few lines per boot.
/home/pi/powerlog/*.csv
/home/pi/throttle_log.csv
/home/pi/SU-WaterCam/output.log
/home/pi/SU-WaterCam/data/temp_humidity.csv
{
    su pi pi
    size 5M
    rotate 4
    compress
    copytruncate
    missingok
    notifempty
}
