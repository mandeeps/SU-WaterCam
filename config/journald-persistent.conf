# Keep the systemd journal on the microSD card for 30 days or more, so a past
# wake can be looked into on the unit. This is the alternative to
# journald-volatile.conf (logs in RAM, lost at each shutdown), for units where
# that history is worth the card writes (about 100-150 MB a day on an hourly
# daytime schedule).
#
# The file-count limit matters most. journald keeps at most 100 journal files
# by default (SystemMaxFiles). A node starts a new file two or three times per
# boot (the clock is stepped early in each boot: "Time jumped backwards,
# rotating"), so 100 files held only about 3 days on 006 even though the size
# limit was 2 GB.
#
# Install as zz-watercam-journal.conf so it is read last and overrides the
# Raspberry Pi OS default (/usr/lib/systemd/journald.conf.d/
# 40-rpi-volatile-storage.conf: Storage=volatile) and any older drop-ins:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp config/journald-persistent.conf /etc/systemd/journald.conf.d/zz-watercam-journal.conf
#   sudo rm -f /etc/systemd/journald.conf.d/journald-volatile.conf    # if installed
#   sudo systemctl restart systemd-journald
#   systemd-analyze cat-config systemd/journald.conf | grep -E '^(Storage|System|MaxRetention)'
[Journal]
Storage=persistent
# Write to the card every 5 s, so a brownout loses at most the last few seconds.
SyncIntervalSec=5s
SystemMaxUse=4G
SystemKeepFree=5G
SystemMaxFiles=1000
MaxRetentionSec=90day
