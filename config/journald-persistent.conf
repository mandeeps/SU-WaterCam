# Keep the systemd journal on the microSD card, for diagnosing a field unit
# (e.g. power problems at a new site). The default for field units is
# journald-volatile.conf (journal in RAM, less card wear); use this instead
# while a unit needs watching, then switch back.
#
# A wake lasts about 2 minutes, but journald normally writes to disk only every
# 5 minutes, so a brownout could lose the whole wake's log. SyncIntervalSec=5s
# keeps at most the last 5 s at risk (messages at CRIT or above are written at
# once). The power logger and the Witty Pi's own log also survive a power cut.
#
# Install (replaces the RAM-only setting):
#   sudo rm -f /etc/systemd/journald.conf.d/journald-volatile.conf
#   sudo cp config/journald-persistent.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald && sudo journalctl --flush
# Read back after a failure, previous boots first:
#   journalctl --list-boots;  journalctl -b -1 -u ticktalk
[Journal]
Storage=persistent
SyncIntervalSec=5s
SystemMaxUse=200M
