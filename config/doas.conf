permit :pi
permit nopass :pi as root cmd /usr/sbin/shutdown
# remote debug session (tools/remote_debug.py) stops ticktalk for the session
# and starts it again afterwards
permit nopass :pi as root cmd /usr/bin/systemctl args stop ticktalk.service
permit nopass :pi as root cmd /usr/bin/systemctl args start ticktalk.service --no-block
# USB power for the modem and microphone (tools/usb_power.py); both hubs on
permit nopass :pi as root cmd /usr/sbin/uhubctl args -l 1-1 -a on
permit nopass :pi as root cmd /usr/sbin/uhubctl args -l 2 -a on
